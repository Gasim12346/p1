{% extends "base.html" %}
{% block title %}404 - الصفحة غير موجودة{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-7 text-center">
            <div class="card border-0 shadow-lg rounded-4 p-5" style="background: #ffffff;">
                <div class="mb-4">
                    <span class="badge rounded-circle p-4" style="background: rgba(30, 58, 138, 0.1); color: #1e3a8a;">
                        <i class="bi bi-compass text-primary" style="font-size: 4rem;"></i>
                    </span>
                </div>
                <h1 class="display-3 fw-bold text-dark mb-2 font-monospace">404</h1>
                <h3 class="fw-bold text-secondary mb-3">الصفحة المطلوبة غير موجودة</h3>
                <p class="text-muted fs-6 mb-4 leading-relaxed">
                    عفواً، الرابط الذي تحاول الوصول إليه غير متاح، أو ربما تم نقله أو حذفه، أو لا تملك الصلاحية الكافية للوصول إليه.
                </p>
                <div class="d-flex justify-content-center gap-3">
                    <a href="javascript:history.back()" class="btn btn-outline-secondary px-4 py-2 rounded-3">
                        <i class="bi bi-arrow-right me-1"></i> العودة للصفحة السابقة
                    </a>
                    <a href="{% url 'training:home' %}" class="btn btn-primary px-4 py-2 rounded-3" style="background-color: #1e3a8a; border-color: #1e3a8a;">
                        <i class="bi bi-house-door me-1"></i> الرئيسية
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
